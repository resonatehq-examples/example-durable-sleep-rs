[package]
name = "example-durable-sleep-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Reliably sleep inside a function for days, weeks, or even years — Resonate Rust SDK."

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[dependencies]
resonate = { package = "resonate-sdk", version = "0.4.0" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
